[advisories]
# Ignore vulnerabilities that we cannot immediately fix due to dependencies.
# Every entry names the dependency that pins the vulnerable version; drop the
# entry once that dependency is upgraded or removed.
ignore = [
    # ethers-rs is deprecated and its last release is pinned to the reqwest 0.11 /
    # hyper 0.14 / rustls 0.21 generation. ampd's own reqwest 0.11 and
    # stellar-rpc-client's jsonrpsee 0.20 sit on the same generation. Each fix
    # below needs a major bump that those block.
    "RUSTSEC-2025-0009",  # ring 0.16 AES panic — via ethers-providers
    "RUSTSEC-2025-0010",  # ring 0.16 unmaintained — via ethers-providers
    "RUSTSEC-2024-0384",  # instant unmaintained — via ethers-providers
    "RUSTSEC-2026-0258",  # h2 0.3 empty DATA frame DoS — fix is h2 >=0.4.16, via hyper 0.14 (reqwest 0.11, ethers-providers, stellar-rpc-client's jsonrpsee 0.20)
    "RUSTSEC-2026-0098",  # rustls-webpki 0.101: name constraints for URI names incorrectly accepted — fix is 0.103.x, via rustls 0.21
    "RUSTSEC-2026-0099",  # rustls-webpki 0.101: name constraints accepted for wildcard certs — fix is 0.103.x, via rustls 0.21
    "RUSTSEC-2026-0104",  # rustls-webpki 0.101: reachable panic in CRL parsing — fix is 0.103.x, via rustls 0.21
    "RUSTSEC-2026-0382",  # rustls-webpki 0.101: certificate verification may accept distrusted intermediates — fix is >=0.103.16, via rustls 0.21
    "RUSTSEC-2026-0346",  # rustls 0.21: Debug impls for client session values expose TLS secrets — fix is >=0.23.46, via reqwest 0.11 and ethers-providers' tokio-tungstenite 0.20
    "RUSTSEC-2026-0349",  # rustls 0.21: unauthenticated ServerHello downgrades later connections to classical key exchange — fix is >=0.23.46, via reqwest 0.11 and ethers-providers' tokio-tungstenite 0.20
    "RUSTSEC-2026-0381",  # webpki-roots 0.25: bundled roots trust distrusted emSign intermediates — fix is >=1.0.10; 0.25 via reqwest 0.11, tokio-tungstenite 0.20, tendermint-rpc and xrpl_http_client

    # alloy 0.7 (via solana-axelar-gateway and axelar-wasm-std)
    "RUSTSEC-2024-0370",  # proc-macro-error unmaintained — via alloy-sol-macro
    "RUSTSEC-2025-0137",  # potential undefined behaviour in ruint — via alloy-primitives
    "RUSTSEC-2026-0220",  # ruint shift ops overflow flags/truncation — fix requires ruint >=1.20.0 (needs Rust 1.90); pending dependency update now that the toolchain supports it

    # CosmWasm 2.2
    "RUSTSEC-2024-0388",  # derivative unmaintained — via cosmwasm-crypto
    "RUSTSEC-2024-0436",  # paste unmaintained — via cosmwasm-crypto and alloy
]
