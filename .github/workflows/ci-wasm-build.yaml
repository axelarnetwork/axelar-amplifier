# Builds, optimizes and validates all CosmWasm contracts with the repo-local image.
name: "CI: Wasm Contract Build"

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-wasm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cosmwasm-compilation:
    name: Build and validate optimized contracts
    runs-on: blacksmith-32vcpu-ubuntu-2204
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          submodules: recursive

      - name: Build optimizer image
        uses: ./.github/actions/build-optimizer

      - name: Build and validate contracts
        run: sh docker/optimizer/run.sh
